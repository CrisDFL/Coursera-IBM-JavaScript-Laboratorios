<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./health_analysis.css">
    <title>Health Analysis Data</title>
</head>
<body>
    <nav>
        <h1>Health Analysis Census</h1>
        <ul>
            <li><a href="./index.html" id="home">Inicio </a></li>
            <li><a href="./health_contact.html" id="contact">Contáctanos </a></li>
            <li><input type="text" id="conditionInput" placeholder="Ingresa una condición de salud">  </li>
            <li><button id='btnSearch'>Buscar</button>
        </ul>
    </nav>
    <div class="container">
        <div class="analysisForm">
            <h1>Analisis de Datos de Salud</h1>
            <div>
                <label for="name">Nombre:</label>
                <input type="text" id="name">
            </div>
            <div>
                <label for="">Genero:</label>
                <label for="male">Masculino</label>
                <input type="radio" name="gender" id="male" value="Male">
                <label for="female">Femenino</label>
                <input type="radio" name="gender" id="female" value="Female">
            </div>
            <div>
                <label for="age">Edad:</label>
                <input type="number" name="age" id="age">
            </div>
            <div>
                <label for="condition">Condicion:</label>
                <select name="condition" id="condition">
                    <option value="">Seleccionar condicion</option>
                    <option value="Diabetes">Diabetes</option>
                    <option value="Thyroid">Tiroides</option>
                    <option value="High Blood Pressure">Presion Arterial Alta</option>
                </select>
            </div>
            <button id="addPatient">Agregar Paciente</button>
            <h2>Informe de analisis</h2>
            <div id="report"></div>
        </div>
        <div class="searchCondition">
            <div id="result"></div>
        </div>
    </div>
    <script src="./health_analysis.js"></script>
</body>
</html>
